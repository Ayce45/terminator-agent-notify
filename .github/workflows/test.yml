name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run pytest without a graphical session
        run: pytest -v
      - name: Check tracked shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -r bash -n
      - name: Compile Python without a graphical session
        run: python -m compileall -q core adapters terminator-plugin
